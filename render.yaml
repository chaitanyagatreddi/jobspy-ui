services:
  - type: web
    name: jobspy-ui
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # set in Render dashboard, do not commit
      - key: PYTHON_VERSION
        value: "3.11"
